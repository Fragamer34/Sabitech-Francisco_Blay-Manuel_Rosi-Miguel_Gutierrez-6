name: sabitech-despliegue

services:
  web:
    build: .
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./app:/var/www/html
    depends_on:
      db:
        condition: service_started

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: sabitech
      MYSQL_USER: sabitech_user
      MYSQL_PASSWORD: Aula_Sabiteck_2026
      MYSQL_ROOT_PASSWORD: Aula_Root_2026
    volumes:
      - mysql_data:/var/lib/mysql

  frontend:
    build:
      context: ../frontend
      dockerfile: dockerfile
      target: dev
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_PROXY_TARGET=http://web:80
    depends_on:
      web:
        condition: service_started

volumes:
  mysql_data:
