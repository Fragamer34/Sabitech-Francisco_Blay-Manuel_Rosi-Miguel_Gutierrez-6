name: sabitech-despliegue

services:
  web:
    build: .
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./app:/var/www/html

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: sabitech
      MYSQL_USER: sabitech_user
      MYSQL_PASSWORD: Aula_Sabiteck_2026
      MYSQL_ROOT_PASSWORD: Aula_Root_2026
    volumes:
      - mysql_data:/var/lib/mysql

  frontend:
    container_name: frontend
    build: ../frontend
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      - API_DESKTOP=http://web:80
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      - web

volumes:
  mysql_data:
