<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reserva de charlas</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <div class="wrap">
    <section class="card">
      <div class="cal-head">
        <button type="button" id="prev" aria-label="Mes anterior">‹</button>
        <h2 id="titulo"></h2>
        <button type="button" id="next" aria-label="Mes siguiente">›</button>
      </div>
      <div class="grid" id="dows"></div>
      <div class="grid" id="dias"></div>
    </section>

    <!-- Cambia action por tu ruta (en Laravel: {{ route('reservas.store') }} y añade @csrf) -->
    <form class="card" id="reserva" action="/reservas" method="POST">
      <h3>Reservar charla</h3>
      <p class="muted" id="vacio">Selecciona una charla en el calendario.</p>
      <dl id="detalle" hidden>
        <dt>Charla</dt><dd id="d-nombre"></dd>
        <dt>Descripción</dt><dd id="d-desc"></dd>
        <dt>Fecha</dt><dd id="d-fecha"></dd>
        <dt>Horario</dt><dd id="d-horas"></dd>
        <dt>Sala</dt><dd id="d-sala"></dd>
      </dl>
      <input type="hidden" name="idCharla" id="idCharla">
      <button class="btn" type="submit" id="btn" disabled>Reservar plaza</button>
    </form>
  </div>

  <script>
    /* ---- DATOS DE EJEMPLO ----
       Sustitúyelos por los datos de tu tabla Charla (fetch a una API o JSON
       generado desde el servidor). Los nombres siguen tus columnas. */
    const charlas = [
      { idCharla: 1, nombreCharla: 'Introducción a Laravel', descripcionCharla: 'Primeros pasos con rutas, controladores y Blade.',
        fechaCharla: '2026-11-18', horaInicioCharla: '10:00:00', horaFinCharla: '11:30:00', estadoCharla: 'PROGRAMADA', idSala: 1 },
      { idCharla: 2, nombreCharla: 'MySQL avanzado', descripcionCharla: 'Índices, joins y optimización de consultas.',
        fechaCharla: '2026-11-18', horaInicioCharla: '12:00:00', horaFinCharla: '13:00:00', estadoCharla: 'ACTUALIZADA', idSala: 2 },
      { idCharla: 3, nombreCharla: 'Git en equipo', descripcionCharla: 'Ramas, pull requests y resolución de conflictos.',
        fechaCharla: '2026-11-25', horaInicioCharla: '09:30:00', horaFinCharla: '10:30:00', estadoCharla: 'CANCELADA', idSala: 1 },
      { idCharla: 4, nombreCharla: 'Seguridad web', descripcionCharla: 'XSS, CSRF e inyección SQL.',
        fechaCharla: '2026-12-02', horaInicioCharla: '16:00:00', horaFinCharla: '17:30:00', estadoCharla: 'PROGRAMADA', idSala: 3 }
    ];

    const hhmm = (t) => t.slice(0, 5);
    const pad = (n) => String(n).padStart(2, '0');
    const esc = (s) => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    let vista = new Date(); vista.setDate(1);
    let seleccionada = null;

    const $ = (id) => document.getElementById(id);
    $('dows').innerHTML = ['L','M','X','J','V','S','D'].map(d => `<div class="dow">${d}</div>`).join('');

    function render() {
      const y = vista.getFullYear(), m = vista.getMonth();
      $('titulo').textContent = vista.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' });

      const offset = (new Date(y, m, 1).getDay() + 6) % 7;   // lunes = 0
      const total = new Date(y, m + 1, 0).getDate();
      const hoy = new Date(); const hoyStr = `${hoy.getFullYear()}-${pad(hoy.getMonth()+1)}-${pad(hoy.getDate())}`;

      let html = '<div class="day empty"></div>'.repeat(offset);
      for (let d = 1; d <= total; d++) {
        const fecha = `${y}-${pad(m + 1)}-${pad(d)}`;
        const delDia = charlas
          .filter(c => c.fechaCharla === fecha)
          .sort((a, b) => a.horaInicioCharla.localeCompare(b.horaInicioCharla));
        html += `<div class="day${fecha === hoyStr ? ' today' : ''}"><div class="num">${d}</div>` +
          delDia.map(c => `
            <button type="button" class="charla ${c.estadoCharla}${seleccionada === c.idCharla ? ' selected' : ''}" data-id="${c.idCharla}">
              ${esc(c.nombreCharla)}<small>${hhmm(c.horaInicioCharla)} – ${hhmm(c.horaFinCharla)}</small>
            </button>`).join('') + '</div>';
      }
      $('dias').innerHTML = html;
    }

    function seleccionar(id) {
      const c = charlas.find(x => x.idCharla === id);
      if (!c || c.estadoCharla === 'CANCELADA') return;
      seleccionada = id;
      $('idCharla').value = id;
      $('d-nombre').textContent = c.nombreCharla;
      $('d-desc').textContent = c.descripcionCharla;
      $('d-fecha').textContent = new Date(c.fechaCharla + 'T00:00').toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
      $('d-horas').textContent = `${hhmm(c.horaInicioCharla)} – ${hhmm(c.horaFinCharla)}`;
      $('d-sala').textContent = 'Sala ' + c.idSala;   // sustituye por el nombre de la sala si lo traes con un JOIN
      $('vacio').hidden = true; $('detalle').hidden = false; $('btn').disabled = false;
      render();
    }

    $('dias').addEventListener('click', (e) => {
      const b = e.target.closest('.charla');
      if (b) seleccionar(Number(b.dataset.id));
    });
    $('prev').onclick = () => { vista.setMonth(vista.getMonth() - 1); render(); };
    $('next').onclick = () => { vista.setMonth(vista.getMonth() + 1); render(); };

    render();
  </script>
</body>
</html>
